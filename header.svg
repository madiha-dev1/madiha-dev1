<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0e1a"/><stop offset="1" stop-color="#151a33"/></linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#818cf8"/><stop offset=".5" stop-color="#c084fc"/><stop offset="1" stop-color="#f472b6"/>
      <animate attributeName="x1" values="-1;0;-1" dur="6s" repeatCount="indefinite"/><animate attributeName="x2" values="0;1;0" dur="6s" repeatCount="indefinite"/></linearGradient>
    <linearGradient id="btn" x1="0" x2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
    <filter id="b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="50"/></filter>
    <clipPath id="c"><rect width="1000" height="340" rx="24"/></clipPath>
    <pattern id="d" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" opacity=".07"/></pattern>
  </defs>
  <style>
    text{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
    .hi{font-size:18px;fill:#94a3b8;animation:up 1s both}
    .name{font-size:66px;font-weight:800;fill:url(#g);letter-spacing:-1px;animation:up 1s .2s both}
    .role{font-size:24px;font-weight:500;fill:#e2e8f0}
    .r1{animation:r 9s infinite}.r2{animation:r 9s 3s infinite;opacity:0}.r3{animation:r 9s 6s infinite;opacity:0}
    @keyframes r{0%{opacity:0;transform:translateY(12px)}6%,30%{opacity:1;transform:none}36%,100%{opacity:0;transform:translateY(-12px)}}
    @keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
    .bt{font-size:15px;font-weight:700;fill:#fff}
    .m{font-family:'Courier New',monospace;font-size:14px;fill:#cbd5e1}
    .k{fill:#c084fc}.s{fill:#86efac}.n{fill:#f9a8d4}.p{fill:#7dd3fc}
    .fl{animation:fl 5s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-12px)}}
    .a1{animation:a1 12s ease-in-out infinite}.a2{animation:a2 14s ease-in-out infinite}
    @keyframes a1{50%{transform:translate(220px,40px)}}@keyframes a2{50%{transform:translate(-240px,-30px)}}
    .pulse{animation:p 1.6s infinite}@keyframes p{0%{r:5;opacity:1}100%{r:14;opacity:0}}
    .cur{animation:bl 1s steps(2) infinite}@keyframes bl{50%{opacity:0}}
  </style>
  <g clip-path="url(#c)">
    <rect width="1000" height="340" fill="url(#bg)"/>
    <g filter="url(#b)"><circle class="a1" cx="120" cy="70" r="110" fill="#6366f1" opacity=".5"/><circle class="a2" cx="880" cy="280" r="120" fill="#ec4899" opacity=".4"/></g>
    <rect width="1000" height="340" fill="url(#d)"/>
    <rect x="1" y="1" width="998" height="338" rx="24" fill="none" stroke="#fff" opacity=".12"/>

    <text x="60" y="95" class="hi">👋 Hello, I'm</text>
    <text x="60" y="165" class="name">Madiha Noor</text>
    <g transform="translate(60,215)">
      <text class="role r1">Full Stack Web Developer</text>
      <text class="role r2">React &amp; Tailwind Specialist</text>
      <text class="role r3">Building Responsive Interfaces</text>
    </g>
    <g transform="translate(60,252)">
      <rect width="210" height="44" rx="22" fill="url(#btn)"/>
      <text x="105" y="28" text-anchor="middle" class="bt">View Portfolio  →</text>
    </g>
    <g transform="translate(290,252)">
      <rect width="190" height="44" rx="22" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".2"/>
      <circle cx="24" cy="22" r="5" fill="#22c55e"/><circle class="pulse" cx="24" cy="22" r="5" fill="#22c55e"/>
      <text x="40" y="27" font-size="14" font-weight="600" fill="#e2e8f0">Open to work</text>
    </g>

    <g class="fl" transform="translate(600,58)">
      <rect width="350" height="224" rx="16" fill="#0d1117" stroke="#fff" stroke-opacity=".15"/>
      <circle cx="22" cy="22" r="6" fill="#ff5f56"/><circle cx="42" cy="22" r="6" fill="#ffbd2e"/><circle cx="62" cy="22" r="6" fill="#27c93f"/>
      <text x="22" y="64" class="m"><tspan class="k">const</tspan> <tspan class="p">madiha</tspan> = {</text>
      <text x="40" y="88" class="m">role: <tspan class="s">"Full Stack Dev"</tspan>,</text>
      <text x="40" y="112" class="m">experience: <tspan class="s">"2.5+ years"</tspan>,</text>
      <text x="40" y="136" class="m">projects: <tspan class="n">5</tspan>+,</text>
      <text x="40" y="160" class="m">stack: [<tspan class="s">"React"</tspan>, <tspan class="s">"C#"</tspan>],</text>
      <text x="22" y="184" class="m">};</text>
      <rect class="cur" x="40" y="192" width="9" height="16" fill="#a78bfa"/>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
